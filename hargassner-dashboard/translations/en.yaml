configuration:
  raumueberwachung_modus:
    name: Room monitoring
    description: "beobachten (observe): room notices are only shown. melden (report): they count for the overall state of the operation monitor."
  heizkreis_1_art:
    name: Heating circuit 1 is
    description: "automatisch (automatic) takes the controller's setting. Otherwise heizkoerper (radiators) or fussboden (underfloor)."
  heizkreis_2_art:
    name: Heating circuit 2 is
    description: "automatisch (automatic) takes the controller's setting. Otherwise heizkoerper (radiators) or fussboden (underfloor)."
  heizkreis_1_sensoren:
    name: Rooms on heating circuit 1
    description: "Easier to choose on the app's room sensor page. Sensors of the rooms that heating circuit 1 heats. Monitoring only, they control nothing."
  heizkreis_2_sensoren:
    name: Rooms on heating circuit 2
    description: "Temperature sensors of the rooms that heating circuit 2 heats."
  haus_sensoren:
    name: Other rooms
    description: "Sensors in rooms without a heating circuit or with closed valves, e.g. cellar or garage. Only the sensor itself is checked."
  kuehlere_raeume:
    name: Rooms that may be cooler
    description: "Rooms kept cooler on purpose (2 degrees below the set value). Rooms of the three lists below are listed here too, so an older app version still treats them as cooler."
  kuehler_4_raeume:
    name: Rooms that may be 4 degrees cooler
    description: "Rooms on a circuit that may be 4 degrees cooler than set. Easier to set on the room page."
  kuehler_6_raeume:
    name: Rooms that may be 6 degrees cooler
    description: "Rooms on a circuit that may be 6 degrees cooler than set. Easier to set on the room page."
  nur_frost_raeume:
    name: Rooms checked for frost and sensor only
    description: "Rooms on a circuit checked only for frost and their sensor: never too cold or too warm, and not counted for the circuit checks."
  raum_einstellungen:
    name: Room settings (from app 1.6.9)
    description: "Per room on a circuit: kuehler 0 to 10 °C (0.5 steps) allowed below the target, einfluss_hk1/2 0 to 100 % (how strongly the circuit heats it). Easiest set on the room page."
  ohne_ueberwaermung:
    name: Rooms with a stove or much sun
    description: "No notice is given when these rooms are too warm."
  haus_frost_sensoren:
    name: Frost warning for other rooms
    description: "Other rooms that get a warning when there is a risk of frost."
  notify_watch:
    name: Watch the notification service
    description: "Enable only with harg-notify installed. Adds a notice to the Betriebsüberwachung when the service is silent for 90 seconds."
