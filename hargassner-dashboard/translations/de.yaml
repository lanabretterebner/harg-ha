configuration:
  raumueberwachung_modus:
    name: Raumüberwachung
    description: "beobachten: Meldungen der Räume werden nur angezeigt. melden: sie zählen für den Gesamtzustand der Betriebsüberwachung."
  heizkreis_1_art:
    name: Heizkreis 1 ist
    description: "automatisch übernimmt die Einstellung der Steuerung. Sonst heizkoerper oder fussboden."
  heizkreis_2_art:
    name: Heizkreis 2 ist
    description: "automatisch übernimmt die Einstellung der Steuerung. Sonst heizkoerper oder fussboden."
  heizkreis_1_sensoren:
    name: Räume an Heizkreis 1
    description: "Einfacher auf der Raumsensoren-Seite der App wählen. Sensoren der Räume, die Heizkreis 1 heizt. Nur zur Überwachung, sie steuern nichts."
  heizkreis_2_sensoren:
    name: Räume an Heizkreis 2
    description: "Temperatursensoren der Räume, die Heizkreis 2 heizt."
  haus_sensoren:
    name: Weitere Räume
    description: "Sensoren in Räumen ohne Heizkreis oder mit geschlossenen Ventilen, z. B. Keller oder Garage. Für sie wird nur der Sensor selbst geprüft."
  kuehlere_raeume:
    name: Räume, die kühler sein dürfen
    description: "Bewusst kühler gehaltene Räume (2 Grad unter dem Sollwert). Räume der drei Listen unten stehen auch hier, damit eine ältere App-Version sie weiter als kühler behandelt."
  kuehler_4_raeume:
    name: Räume, die 4 Grad kühler sein dürfen
    description: "Räume an einem Heizkreis, die 4 Grad kühler sein dürfen. Einfacher auf der Raumseite einzustellen."
  kuehler_6_raeume:
    name: Räume, die 6 Grad kühler sein dürfen
    description: "Räume an einem Heizkreis, die 6 Grad kühler sein dürfen. Einfacher auf der Raumseite einzustellen."
  nur_frost_raeume:
    name: Räume nur mit Frost- und Sensorprüfung
    description: "Räume an einem Heizkreis, für die nur Frost und der Sensor geprüft werden: nie zu kalt oder zu warm, und sie zählen nicht für die Heizkreis-Prüfungen."
  ohne_ueberwaermung:
    name: Räume mit Ofen oder viel Sonne
    description: "Für diese Räume wird nicht gemeldet, wenn sie zu warm sind."
  haus_frost_sensoren:
    name: Frostwarnung für weitere Räume
    description: "Weitere Räume, für die bei Frostgefahr gewarnt wird."
  notify_watch:
    name: Benachrichtigungsdienst überwachen
    description: "Nur mit installiertem harg-notify einschalten. Meldet in der Betriebsüberwachung einen Hinweis, wenn der Dienst 90 Sekunden schweigt."
