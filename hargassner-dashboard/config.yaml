name: Hargassner Dashboard
version: "1.6.7"
slug: hargassner_dashboard
description: Open the local Hargassner dashboard using your Home Assistant login.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: Hargassner
panel_admin: false
homeassistant_api: true
options:
  upstream_url: null
  ingress_token: null
  monitor_enabled: false
  monitor_token: ""
  monitor_poll_interval: 30
  raumueberwachung_modus: beobachten
  heizkreis_1_art: automatisch
  heizkreis_2_art: automatisch
  heizkreis_1_sensoren: []
  heizkreis_2_sensoren: []
  haus_sensoren: []
  kuehlere_raeume: []
  ohne_ueberwaermung: []
  haus_frost_sensoren: []
  notify_watch: false
schema:
  upstream_url: url
  upstream_connect_host: "str?"
  ingress_token: password
  monitor_enabled: bool
  monitor_token: "password?"
  monitor_poll_interval: "int(15,60)"
  raumueberwachung_modus: "list(beobachten|melden)"
  heizkreis_1_art: "list(automatisch|heizkoerper|fussboden)"
  heizkreis_2_art: "list(automatisch|heizkoerper|fussboden)"
  heizkreis_1_sensoren: ["match(^sensor\\.[a-z0-9_]{1,200}$)"]
  heizkreis_2_sensoren: ["match(^sensor\\.[a-z0-9_]{1,200}$)"]
  haus_sensoren: ["match(^sensor\\.[a-z0-9_]{1,200}$)"]
  kuehlere_raeume: ["match(^sensor\\.[a-z0-9_]{1,200}$)"]
  ohne_ueberwaermung: ["match(^sensor\\.[a-z0-9_]{1,200}$)"]
  haus_frost_sensoren: ["match(^sensor\\.[a-z0-9_]{1,200}$)"]
  notify_watch: bool
url: https://github.com/lanabretterebner/harg-ha/tree/main/hargassner-dashboard
