name: Hargassner Dashboard
version: "1.5.2"
slug: hargassner_dashboard
description: Open the local Hargassner dashboard using your Home Assistant login.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: Hargassner
panel_admin: false
homeassistant_api: true
options:
  upstream_url: null
  ingress_token: null
  monitor_enabled: false
  monitor_token: ""
  monitor_poll_interval: 30
schema:
  upstream_url: url
  upstream_connect_host: "str?"
  ingress_token: password
  monitor_enabled: bool
  monitor_token: "password?"
  monitor_poll_interval: "int(15,60)"
url: https://github.com/lanabretterebner/harg-ha/tree/main/hargassner-dashboard
