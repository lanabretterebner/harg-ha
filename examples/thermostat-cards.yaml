# Native HA tiles; paste into Dashboard > Edit > Add card > Manual.
# Auto1=day,2/3/4=setback both circuits;9 remains phase-ambiguous.
# Verify actual registry IDs and any HA suffixes before using these examples.
# HACS/manual popup1.4.3 supplies one Modus menu, mode icons and status.
# Requires backend Heizkreisstatus attributes; verify actual registry IDs.
# Native tile state_content supports an entity attribute; no extra state sensor.
# Dial changes correction only; separate day/setback numbers edit the bases.
type: vertical-stack
cards:
- type: tile
  entity: climate.heizkreis_1
  name: Heizkreis 1
  state_content:
  - temperature
  - Heizkreisstatus
  tap_action:
    action: more-info
  icon_tap_action:
    action: more-info
- type: tile
  entity: number.heizkreis_1_tagtemperatur
  name: Heizkreis 1 · Tagestemperatur
  features:
  - type: numeric-input
    style: buttons
- type: tile
  entity: number.heizkreis_1_absenktemperatur
  name: Heizkreis 1 · Absenktemperatur
  features:
  - type: numeric-input
    style: buttons
- type: tile
  entity: number.heizkreis_1_raumkorrektur
  name: Heizkreis 1 · Raumkorrektur
  features:
  - type: numeric-input
    style: buttons
- type: tile
